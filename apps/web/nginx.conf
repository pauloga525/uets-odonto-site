# Nginx: SPA Angular + proxy a la API (mismo origen → cookies SameSite y sin CORS).
# En producción el HTTPS lo termina Caddy (deploy/Caddyfile) delante de este contenedor.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Detrás de Caddy (HTTPS) se conserva el protocolo original que informa el proxy.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 1m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  include /etc/nginx/security-headers.conf;

  # API REST + WebSocket (Socket.IO)
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 75s;
  }

  # Recursos con hash: caché larga
  location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  # SPA: cualquier otra ruta sirve index.html (sin caché)
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
