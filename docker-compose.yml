name: sistema-odonto

# Desarrollo:  docker compose up -d db
# Producción:  sudo bash deploy/instalar-ubuntu.sh   (ver docs/DESPLIEGUE-UBUNTU.md)
#              Publica la app con Cloudflare Tunnel (https://<palabras>.trycloudflare.com), sin abrir puertos.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: odonto
      POSTGRES_USER: odonto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odonto_dev}
      TZ: America/Guayaquil
      PGTZ: America/Guayaquil
    ports:
      # Solo accesible desde el propio equipo (nunca expuesto a internet)
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odonto -d odonto"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://odonto:${POSTGRES_PASSWORD:-odonto_dev}@db:5432/odonto?schema=public
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    profiles: ["prod"]

  # Nginx: sirve el frontend Angular y hace de proxy de /api hacia la API
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      # Solo local: útil para diagnóstico (curl http://127.0.0.1:8080).
      # El acceso público llega únicamente por el túnel de Cloudflare.
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    profiles: ["prod"]

  # Cloudflare Tunnel rápido: publica Nginx en https://<palabras>.trycloudflare.com sin abrir puertos.
  # La dirección actual se muestra con:  sudo bash deploy/tunel-url.sh
  # Cambia si este contenedor se reinicia (hay que actualizarla en Google Cloud).
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://web:80
    depends_on:
      - web
    profiles: ["prod"]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-odonto_dev}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U odonto -d odonto -Fc -f /backups/odonto_$$(date +%Y%m%d_%H%M).dump;
        find /backups -name "*.dump" -mtime +14 -delete;
        sleep 86400; done'
    depends_on:
      db:
        condition: service_healthy
    profiles: ["prod"]

volumes:
  db_data:
